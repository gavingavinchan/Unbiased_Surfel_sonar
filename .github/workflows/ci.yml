name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: ci/requirements.lock
      - name: Syntax check every Python file
        run: python -m compileall -q . -x '(submodules|\.venv|venv)'
      - name: Install locked CPU dependencies (fail on error)
        run: bash ci/install_cpu_deps.sh
      - name: CPU unit tests (explicit CUDA skips)
        run: bash ci/run_cpu_tests.sh
