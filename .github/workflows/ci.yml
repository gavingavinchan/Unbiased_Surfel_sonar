name: ci
on: [push, pull_request]
jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - name: Syntax check every Python file
        run: python -m compileall -q . -x '(submodules|\.venv|venv)'
      - name: Install CPU test dependencies
        run: |
          python -m pip install numpy pytest pyyaml scipy opencv-python-headless pillow matplotlib
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: CPU unit tests
        run: python -m pytest -q tests -k "not cuda and not gpu" -p no:cacheprovider --junitxml=cpu-tests.xml
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-test-results
          path: cpu-tests.xml
          if-no-files-found: warn
